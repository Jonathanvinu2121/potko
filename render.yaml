# Render blueprint for the POTKO server (free web service).
# On Render: New > Blueprint > pick this repository. Then fill in the two secrets it asks for.
# The database is NOT created here: use Neon (Render's free Postgres expires after 30 days).
services:
  - type: web
    name: potko-server
    runtime: node
    plan: free
    region: singapore # closest Render region to India; create the Neon database in Singapore too
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string (keep ?sslmode=require)
      - key: JWT_SECRET
        generateValue: true
      # The code the client types on the app's first screen to set up their restaurant on an empty
      # database (Render makes a random one: read it under Environment and give it to the client).
      - key: SETUP_CODE
        generateValue: true
      - key: NODE_VERSION
        value: "22"

  # The public demo: a link anyone can open to try POTKO. The same server with a database of its own
  # in memory, filled with the demo restaurant (it starts afresh whenever the service restarts), and
  # the web app at the same address, with one-tap sign-in. It never reads DATABASE_URL, so it cannot
  # reach the client's data. Deployed from the demo branch (see README, Public demo).
  - type: web
    name: potko-demo
    runtime: node
    plan: free
    region: singapore
    branch: demo
    rootDir: server
    buildCommand: npm install # includes the in-memory database (a dev dependency)
    startCommand: node --expose-gc src/demo.js
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
